name: Build UEFI for spacewar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch submodules (shallow, parallel)
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: apt-cache
          key: apt-${{ hashFiles('setup_env.sh') }}
          restore-keys: apt-

      - name: Prime apt cache
        run: |
          mkdir -p apt-cache
          sudo cp -n apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pip-requirements.txt') }}
          restore-keys: pip-

      - name: Refresh package lists
        run: sudo apt-get update

      - name: Build UEFI for spacewar
        run: |
          time bash ./setup_env.sh -p apt
          time python3 build_uefi.py -d spacewar -r DEBUG -c

      - name: Update apt cache
        if: always()
        run: sudo cp -n /var/cache/apt/archives/*.deb apt-cache/ 2>/dev/null || true

      - name: Upload UEFI image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uefi-spacewar
          path: ./Mu-*
          compression-level: 9
          if-no-files-found: warn
